[package]
name = "resolver"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.1.0"
borsh = { version = "1.3.0", features = ["derive", "unstable__schema"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = { version = "0.8", features = ["derive"] }
shared_fusion_data = { path = "../shared" }

[dev-dependencies]
near-sdk = { version = "5.1.0", features = ["unit-testing"] }
escrow = { path = "../escrow" }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true 