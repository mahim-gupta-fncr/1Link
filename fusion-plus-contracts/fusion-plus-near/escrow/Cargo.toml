[package]
name = "escrow"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# `contract` enables the near-bindgen exports. It is on by default when building the escrow contract
# stand-alone, but can be disabled (e.g. when used as a dependency) with `default-features = false`.
default = ["contract"]
contract = []

[dependencies]
near-sdk = "5.1.0"
borsh = { version = "1.3.0", features = ["derive", "unstable__schema"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = { version = "0.8", features = ["derive"] }
shared_fusion_data = { path = "../shared" }

[dev-dependencies]
near-sdk = { version = "5.1.0", features = ["unit-testing"] }
near-workspaces = "0.10.0"
tokio = { version = "1.14.0", features = ["full"] }
anyhow = "1.0.68"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true 