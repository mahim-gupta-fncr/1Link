[package]
name = "escrow-src"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
near-sdk = { version = "5.1.0", features = ["unit-testing"] }
near-contract-standards = "5.1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shared_fusion_data = { path = "../shared" }

[dev-dependencies]
near-sdk = { version = "5.1.0", features = ["unit-testing"] }
tokio = { version = "1.18", features = ["full"] }

[features]
default = ["contract"]
contract = []
