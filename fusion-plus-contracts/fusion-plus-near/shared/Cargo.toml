[package]
name = "shared_fusion_data"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib"]

[dependencies]
borsh = { version = "1.3.0", features = ["derive", "unstable__schema"] }
near-sdk = { version = "5.1.0", default-features = false, features = ["non-contract-usage"] }
schemars = { version = "0.8", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] } 