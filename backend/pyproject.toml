[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "backend"
version = "0.1.0"
description = "backend for 1inch fusion+ project"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    {name = "Mahim Gupta", email = "mahim.g03@gmail.com"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
]

dependencies = [
    "asyncpg>=0.30.0",
    "base58>=2.1.1",
    "fastapi>=0.116.0",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "py-near>=1.1.57",
    "py-near-primitives>=0.2.4",
    "pycryptodome>=3.23.0",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.1.0",
    "pynacl>=1.5.0",
    "pyonear>=0.1.0",
    "python-dotenv>=1.1.1",
    "python-multipart>=0.0.20",
    "requests>=2.32.4",
    "sqlalchemy[asyncio]>=2.0.41",
    "uvicorn[standard]>=0.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.28.1",
    "ruff>=0.1.0",
]


[tool.hatch.build.targets.wheel]
packages = ["resolver", "relayer", "common"]
